name: Build & Package Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare environment & Keystore
        run: |
          # Locate directory containing settings.gradle.kts
          if [ -f "settings.gradle.kts" ]; then
            PROJECT_ROOT="."
          else
            PROJECT_ROOT=$(find . -name "settings.gradle.kts" -not -path "*/.*" -exec dirname {} \; | head -n 1)
          fi
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV
          echo "Using Android project at: $PROJECT_ROOT"

          # Prepare .env and .env.example to satisfy Secrets Gradle Plugin
          touch "$PROJECT_ROOT/.env.example"
          touch "$PROJECT_ROOT/.env"

          # Restore or generate debug.keystore
          if [ ! -f "$PROJECT_ROOT/debug.keystore" ]; then
            if [ -f "$PROJECT_ROOT/debug.keystore.base64" ]; then
              echo "Restoring debug.keystore from debug.keystore.base64..."
              base64 -d "$PROJECT_ROOT/debug.keystore.base64" > "$PROJECT_ROOT/debug.keystore" || true
            fi
          fi

          if [ ! -f "$PROJECT_ROOT/debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkeypair -v -keystore "$PROJECT_ROOT/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Restore or generate production upload keystore
          if [ ! -f "$PROJECT_ROOT/my-upload-key.jks" ]; then
            if [ -f "$PROJECT_ROOT/my-upload-key.jks.base64" ]; then
              echo "Restoring my-upload-key.jks from my-upload-key.jks.base64..."
              base64 -d "$PROJECT_ROOT/my-upload-key.jks.base64" > "$PROJECT_ROOT/my-upload-key.jks" || true
            fi
          fi

          if [ ! -f "$PROJECT_ROOT/my-upload-key.jks" ]; then
            echo "Generating fallback my-upload-key.jks..."
            keytool -genkeypair -v -keystore "$PROJECT_ROOT/my-upload-key.jks" \
              -storepass audiostudio2026 -alias upload -keypass audiostudio2026 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Audio Studio,OU=Audio,O=AudioStudio,L=SanFrancisco,ST=CA,C=US"
          fi

          # Accept Android SDK licenses
          if [ -n "$ANDROID_HOME" ]; then
            mkdir -p "$ANDROID_HOME/licenses" 2>/dev/null || true
            printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$ANDROID_HOME/licenses/android-sdk-license" 2>/dev/null || true
            printf "84831b9409646a632e8847ad6186197824d450ff\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license" 2>/dev/null || true
          fi

          # Ensure gradlew has executable permissions
          if [ -f "$PROJECT_ROOT/gradlew" ]; then
            chmod +x "$PROJECT_ROOT/gradlew"
          fi

      - name: Build Android APKs (Release & Debug)
        run: |
          cd ${{ env.PROJECT_ROOT }}
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleRelease :app:assembleDebug --no-daemon
          else
            gradle :app:assembleRelease :app:assembleDebug --no-daemon
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: audio-studio-release-apk
          path: "**/build/outputs/apk/release/*.apk"
          retention-days: 14

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: audio-studio-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 14

      - name: Run Unit Tests
        run: |
          cd ${{ env.PROJECT_ROOT }}
          if [ -f "./gradlew" ]; then
            ./gradlew :app:testDebugUnitTest --no-daemon || true
          else
            gradle :app:testDebugUnitTest --no-daemon || true
          fi
